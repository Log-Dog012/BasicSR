# SwinIR-M x4 单通道灰度版微调（低压 SEM）
# 基于 RGB 版 15k checkpoint 转换的灰度权重

name: finetune_SwinIR_SRx4_SEM_gray
model_type: SwinIRModel
scale: 4
num_gpu: auto
manual_seed: 0

datasets:
  train:
    name: SEM_gray
    type: PairedImageDataset
    dataroot_gt: datasets/swinir_train_gray/HR
    dataroot_lq: datasets/swinir_train_gray/LR_x4
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 192
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: LVSEM_eval_gray
    type: PairedImageDataset
    dataroot_gt: datasets/eval/SEMimg_gray
    dataroot_lq: datasets/eval/LR_gray
    io_backend:
      type: disk

network_g:
  type: SwinIR
  upscale: 4
  in_chans: 1  # 单通道灰度
  img_size: 48
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

path:
  pretrain_network_g: ~  # 从零开始训练单通道版本
  strict_load_g: false
  resume_state: ~
auto_resume: true

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4  # 从零训练，用稍大 lr
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [20000, 40000, 55000, 65000]
    gamma: 0.5

  total_iter: 70000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
